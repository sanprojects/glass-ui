name: Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir _site
          cp Glass-UI.html _site/index.html
          cp -r scenes _site/scenes
          # the demo keeps loading the plain names; the files behind them are minified here,
          # so the page is always built from the current sources
          for f in glass-*.css glass-*.js; do
            case "$f" in *.min.*) continue;; esac
            npx --yes esbuild@0.24.2 "$f" --minify --log-level=error --outfile="_site/$f"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
