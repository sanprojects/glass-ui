<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabs keep the hash, the ruler follows, the time counts</title>
<link rel="stylesheet" href="../glass-ui.css">
<script src="../glass-ui.js" defer></script>
<style>body { margin: 0; } #box { height: 300px; overflow: auto; } #box section { min-height: 260px; }</style>
</head>
<body>
<main class="g-root">
  <div id="box">
    <div role="tablist" id="tabs">
      <button type="button" role="tab" id="visitors">Visitors <span>2</span></button>
      <button type="button" role="tab" id="messages">Messages <span>1</span></button>
    </div>
    <section role="tabpanel" id="pTab-visitors">
      <section id="svc-shop" data-ruler="shop · 1"><h6>shop</h6><p>one</p></section>
      <section id="svc-blog" data-ruler="blog · 1"><h6>blog</h6><p>two</p></section>
    </section>
    <section role="tabpanel" id="pTab-msgs" hidden>
      <p><span id="ago" data-g-ago="45000">45 s</span> ago</p>
      <p><span id="left" data-g-left="30000">30 s</span> left</p>
    </section>
  </div>
  <div role="tablist" id="loose"><button type="button">A</button><button type="button">B</button></div>
</main>
</body>
</html>
